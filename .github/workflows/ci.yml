name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Test and build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  reciters:
    name: Check reciter audio links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check-reciters

  android:
    name: Build Android APK
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The app's signing key is committed encrypted (signing/lawh.p12.enc); one secret, its password, unlocks
        # it. Every build is then signed with the same key, so updates install over the previous version.
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SIGNING_PASSWORD \
              -in signing/lawh.p12.enc -out "$RUNNER_TEMP/release.p12"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.p12" ANDROID_KEY_ALIAS=lawh
            export ANDROID_KEYSTORE_PASSWORD="$SIGNING_PASSWORD" ANDROID_KEY_PASSWORD="$SIGNING_PASSWORD"
          elif [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No signing key configured; the APK is signed with a temporary debug key."
          fi
          ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk lawh.apk
      - name: Show the signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs lawh.apk | grep -E "DN|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: lawh-apk
          path: lawh.apk
      # A stable download link for the newest APK built from main:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/lawh.apk
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest lawh.apk \
            --target "$GITHUB_SHA" \
            --title "لوح – أحدث نسخة أندرويد" \
            --notes "نسخة تجريبية مبنية تلقائيًا من آخر تحديث (${GITHUB_SHA::7}). حمّل الملف lawh.apk وثبّته على هاتفك."
